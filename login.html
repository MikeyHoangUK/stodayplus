<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="Marketing/Logo/Stoday/2f8391d1-2ce8-452d-99ed-c30657d2ce65_removalai_preview.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" sizes="180x180" href="Marketing/Logo/Stoday/2f8391d1-2ce8-452d-99ed-c30657d2ce65_removalai_preview.png" />
  <title>Log In — Stoday Plus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:   { DEFAULT: '#1e3a8a', dark: '#1e1b4b', mid: '#3730a3' },
            purple: { light: '#f3e8ff', soft: '#e9d5ff', mid: '#c084fc', DEFAULT: '#9333ea', deep: '#7e22ce' }
          },
          fontFamily: { sans: ['Raleway', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />
  <style>
    .gradient-dark  { background: linear-gradient(135deg, #1e1b4b 0%, #1e3a8a 100%); }
    .gradient-brand { background: linear-gradient(135deg, #9333ea 0%, #3730a3 100%); }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex">

  <!-- Left panel (decorative, desktop only) -->
  <div class="hidden lg:flex lg:w-5/12 gradient-dark flex-col justify-between p-12">
    <a href="index.html" class="flex items-center gap-2">
      <img src="Marketing/Logo/Stoday/2f8391d1-2ce8-452d-99ed-c30657d2ce65_removalai_preview.png" alt="" class="w-10 h-10 object-contain" />
      <span class="text-white font-extrabold text-xl">Stoday <span class="text-purple-mid">Plus</span></span>
    </a>
    <div>
      <img src="Marketing/Logo/Stoday/2f8391d1-2ce8-452d-99ed-c30657d2ce65_removalai_preview.png" alt="" class="w-36 mx-auto mb-8 opacity-90" />
      <blockquote class="text-white text-xl font-semibold leading-relaxed mb-4">
        "I study because I choose to.<br />Not because I have to."
      </blockquote>
      <p class="text-gray-400 text-sm">— The Stoday Plus mindset</p>
    </div>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-gray-300 text-sm"><span class="text-purple-mid">✓</span> Science-backed techniques</div>
      <div class="flex items-center gap-2 text-gray-300 text-sm"><span class="text-purple-mid">✓</span> 30 minutes a day</div>
      <div class="flex items-center gap-2 text-gray-300 text-sm"><span class="text-purple-mid">✓</span> Built by a student who did it</div>
    </div>
  </div>

  <!-- Right panel: login form -->
  <div class="flex-1 bg-gray-50 flex flex-col justify-center px-6 sm:px-12 lg:px-16 py-12">
    <div class="max-w-md w-full mx-auto">

      <!-- Mobile logo -->
      <a href="index.html" class="flex items-center gap-2 mb-8 lg:hidden">
        <img src="Marketing/Logo/Stoday/2f8391d1-2ce8-452d-99ed-c30657d2ce65_removalai_preview.png" alt="" class="w-9 h-9 object-contain" />
        <span class="font-extrabold text-navy-dark text-lg">Stoday <span class="text-purple-DEFAULT">Plus</span></span>
      </a>

      <!-- Tab toggle -->
      <div class="flex gap-1 mb-7 bg-gray-100 rounded-xl p-1">
        <button id="tab-signin" onclick="setTab('signin')"
                class="flex-1 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-navy-dark">
          Sign in
        </button>
        <button id="tab-signup" onclick="setTab('signup')"
                class="flex-1 py-2 rounded-lg text-sm font-bold transition-all text-gray-400">
          Create account
        </button>
      </div>

      <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <!-- Heading changes with tab -->
        <h1 id="auth-heading" class="text-2xl font-extrabold text-navy-dark mb-1">Welcome back</h1>
        <p id="auth-sub" class="text-gray-500 text-sm mb-6">Sign in to access your study space.</p>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email address</label>
            <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-DEFAULT focus:border-transparent transition" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-sm font-semibold text-gray-700">Password</label>
              <button id="forgot-link" type="button" onclick="handleForgot()"
                      class="text-xs text-purple-DEFAULT hover:underline">Forgot password?</button>
            </div>
            <input id="auth-password" type="password" placeholder="Your password"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-DEFAULT focus:border-transparent transition" />
          </div>
          <div id="confirm-wrap" style="display:none">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Confirm password</label>
            <input id="auth-confirm" type="password" placeholder="Repeat password"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-DEFAULT focus:border-transparent transition" />
          </div>
          <p id="auth-error" class="text-red-500 text-xs min-h-[16px]"></p>
          <p id="auth-success" class="text-green-600 text-xs min-h-[16px] hidden"></p>
          <button id="auth-submit" type="button" onclick="handleAuthSubmit()"
                  class="w-full gradient-brand text-white font-bold py-3.5 rounded-xl hover:opacity-90 transition-opacity text-sm">
            Sign in →
          </button>
        </div>
      </div>

      <div class="mt-5">
        <div class="relative flex items-center justify-center mb-5">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
          <span class="relative bg-gray-50 px-3 text-xs text-gray-400">or</span>
        </div>
        <button onclick="tryDemo()"
                class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded-xl py-3 text-sm font-bold text-gray-600 hover:bg-gray-100 transition bg-white shadow-sm">
          <span>👀</span> Try the demo
        </button>
        <p class="text-center text-gray-400 text-xs mt-2">No account needed · data stays local only</p>
      </div>

      <p class="text-center mt-4">
        <a href="index.html" class="text-gray-400 text-xs hover:text-gray-600 transition-colors">← Back to site</a>
      </p>

      <script>
        var SUPABASE_URL  = 'https://zdmnwykumprntbpfyour.supabase.co';
        var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbW53eWt1bXBybnRicGZ5b3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDc0MjAsImV4cCI6MjA5NzM4MzQyMH0.QBZ-4KR5da4O5YoOpErC_HLmYlL953YKIB50g52HkEg';
        var OWNER_EMAILS  = ['mikey@stoday.plus', 'haianhverynice@gmail.com'];
        var _sb = null;
        var _authTab = 'signin';

        // Init Supabase and auto-redirect if session already exists
        (function() {
          if (!window.supabase) return;
          _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
          _sb.auth.getSession().then(function(r) {
            var session = r && r.data && r.data.session;
            if (session && session.user) {
              _redirectAfterLogin(session.user.email);
            }
          });
        })();

        function _redirectAfterLogin(email) {
          sessionStorage.setItem('sp_user', email);
          var role = OWNER_EMAILS.indexOf(email.toLowerCase()) !== -1 ? 'owner' : 'customer';
          sessionStorage.setItem('sp_role', role);
          window.location.href = role === 'owner' ? 'admin.html' : 'dashboard.html';
        }

        function setTab(t) {
          _authTab = t;
          var isSignup = t === 'signup';
          document.getElementById('tab-signin').className  = 'flex-1 py-2 rounded-lg text-sm font-bold transition-all ' + (isSignup ? 'text-gray-400' : 'bg-white shadow-sm text-navy-dark');
          document.getElementById('tab-signup').className  = 'flex-1 py-2 rounded-lg text-sm font-bold transition-all ' + (isSignup ? 'bg-white shadow-sm text-navy-dark' : 'text-gray-400');
          document.getElementById('auth-heading').textContent = isSignup ? 'Create your account' : 'Welcome back';
          document.getElementById('auth-sub').textContent     = isSignup ? 'Your questions sync across all your devices.' : 'Sign in to access your study space.';
          document.getElementById('auth-submit').textContent  = isSignup ? 'Create account →' : 'Sign in →';
          document.getElementById('confirm-wrap').style.display = isSignup ? 'block' : 'none';
          document.getElementById('forgot-link').style.display  = isSignup ? 'none'  : 'inline';
          document.getElementById('auth-error').textContent   = '';
          document.getElementById('auth-success').classList.add('hidden');
        }

        async function handleAuthSubmit() {
          if (!_sb) { document.getElementById('auth-error').textContent = 'Connection error — please refresh.'; return; }
          var email = (document.getElementById('auth-email').value || '').trim().toLowerCase();
          var pass  = (document.getElementById('auth-password').value || '');
          var conf  = (document.getElementById('auth-confirm').value || '');
          var errEl = document.getElementById('auth-error');
          var btn   = document.getElementById('auth-submit');
          errEl.textContent = '';
          if (!email || !pass) { errEl.textContent = 'Please fill in all fields.'; return; }
          if (_authTab === 'signup' && pass !== conf) { errEl.textContent = 'Passwords do not match.'; return; }
          if (pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
          btn.disabled = true; btn.textContent = 'Please wait…';
          var r = _authTab === 'signup'
            ? await _sb.auth.signUp({ email: email, password: pass })
            : await _sb.auth.signInWithPassword({ email: email, password: pass });
          btn.disabled = false;
          btn.textContent = _authTab === 'signup' ? 'Create account →' : 'Sign in →';
          if (r.error) {
            errEl.textContent = r.error.message;
            return;
          }
          if (_authTab === 'signup') {
            var confirmed = r.data && r.data.user && r.data.user.email_confirmed_at;
            if (!confirmed) {
              document.getElementById('auth-success').textContent = '✓ Account created! Check your email to confirm, then sign in.';
              document.getElementById('auth-success').classList.remove('hidden');
              setTab('signin');
              return;
            }
          }
          // Sign-in success (or sign-up with email confirmation disabled)
          if (r.data && r.data.user) {
            _redirectAfterLogin(r.data.user.email);
          }
        }

        async function handleForgot() {
          if (!_sb) return;
          var email = (document.getElementById('auth-email').value || '').trim().toLowerCase();
          if (!email) { document.getElementById('auth-error').textContent = 'Enter your email above first.'; return; }
          await _sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/dashboard.html' });
          document.getElementById('auth-success').textContent = '✓ Password reset email sent — check your inbox.';
          document.getElementById('auth-success').classList.remove('hidden');
        }

        function tryDemo() {
          sessionStorage.setItem('sp_user', 'demo@stoday.plus');
          sessionStorage.setItem('sp_role', 'customer');
          window.location.href = 'dashboard.html';
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') handleAuthSubmit();
        });
      </script>
    </div>
  </div>

</body>
</html>
